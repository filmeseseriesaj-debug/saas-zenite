<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Lojista</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Configurações da Minha Empresa</h1>
        <p class="text-sm text-slate-500">Defina o nicho, cores, dados e catálogo do seu negócio</p>
      </div>
      <a id="btn-ver-loja" href="#" target="_blank" class="hidden text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-2 rounded-lg">
        Ver Minha Vitrine ↗
      </a>
    </div>

    <!-- Identidade & Nicho -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-base font-semibold mb-4 text-slate-900">1. Identidade & Nicho do Negócio</h2>
      
      <form id="form-loja" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Nome da Empresa</label>
            <input type="text" id="nome_loja" required placeholder="Ex: Barbearia VIP ou Burger Prime" class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Slug (Identificador na URL)</label>
            <input type="text" id="slug" required placeholder="ex: barbearia-vip" class="w-full border rounded-lg p-2.5 text-sm" />
            <span class="text-[11px] text-slate-400">Sem espaços nem acentos.</span>
          </div>
        </div>

        <!-- CAMPO DE NICHO / MOTOR DO SISTEMA -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-blue-700 mb-1">Nicho / Motor do Sistema *</label>
            <select id="nicho" required class="w-full border border-blue-300 bg-blue-50/40 rounded-lg p-2.5 text-sm font-semibold text-slate-800">
              <option value="delivery">🍔 Delivery & Alimentação (Sacola / WhatsApp)</option>
              <option value="servicos">✂️ Serviços & Barbearia / Clínica (Agendamento Online)</option>
              <option value="varejo">🛍️ Varejo & Catálogo (Lojas / Vestuário)</option>
            </select>
            <span class="text-[11px] text-slate-500 block mt-0.5">O sistema direciona o motor correto automaticamente.</span>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">WhatsApp para Pedidos/Agenda (com DDD)</label>
            <input type="text" id="whatsapp" required placeholder="21999998888" class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Cor Principal</label>
            <div class="flex items-center gap-3">
              <input type="color" id="cor_primaria" value="#e11d48" class="w-10 h-10 border rounded cursor-pointer" />
              <span id="hex-preview" class="text-xs text-slate-500 font-mono">#e11d48</span>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">URL da Logomarca (opcional)</label>
            <input type="url" id="logo_url" placeholder="https://exemplo.com/logo.png" class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Salvar Dados da Empresa
        </button>
      </form>
    </div>

    <!-- Cadastro de Itens (Produtos ou Serviços) -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-base font-semibold mb-4 text-slate-900" id="titulo-secao-itens">2. Adicionar Produto / Serviço</h2>
      
      <form id="form-produto" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1" id="label-prod-nome">Nome do Item</label>
            <input type="text" id="prod_nome" required placeholder="Ex: Hambúrguer Artesanal ou Corte Degradê" class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Preço (R$)</label>
            <input type="number" step="0.01" id="prod_preco" required placeholder="29.90" class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Categoria (opcional)</label>
            <input type="text" id="prod_categoria" placeholder="Ex: Lanches, Pizzas, Cabelo, Barba..." class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">URL da Foto do Item (opcional)</label>
            <input type="url" id="prod_imagem" placeholder="https://exemplo.com/foto.jpg" class="w-full border rounded-lg p-2.5 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Descrição</label>
          <textarea id="prod_descricao" rows="2" placeholder="Detalhes dos ingredientes ou do procedimento..." class="w-full border rounded-lg p-2.5 text-sm"></textarea>
        </div>

        <button type="submit" id="btn-cadastrar-item" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Cadastrar no Catálogo
        </button>
      </form>
    </div>

  </div>

  <script type="module" src="/src/painel.js"></script>
</body>
</html>
