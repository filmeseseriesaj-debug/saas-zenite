<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso ao Painel do Lojista</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
  <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-slate-700/30">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-blue-600 text-white rounded-xl mx-auto flex items-center justify-center font-bold text-xl mb-3 shadow-md shadow-blue-500/30">
        ⚡
      </div>
      <h1 class="text-xl font-extrabold text-slate-900" id="titulo-form">Entrar no Painel</h1>
      <p class="text-xs text-slate-500 mt-1" id="subtitulo-form">Gerencie sua vitrine e produtos</p>
    </div>

    <form id="auth-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Seu E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com" class="w-full border rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Sua Senha</label>
        <input type="password" id="senha" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full border rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition">
        Entrar
      </button>
    </form>

    <div class="mt-5 text-center pt-4 border-t border-slate-100">
      <button id="toggle-auth" type="button" class="text-xs text-blue-600 hover:underline font-medium">
        Não tem uma conta? Cadastre-se aqui
      </button>
    </div>
  </div>

  <script type="module" src="/src/auth.js"></script>
</body>
</html>
