<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="agenda-titulo">Agendamento Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    :root { --cor-primaria: #4f46e5; }
    .bg-primaria { background-color: var(--cor-primaria) !important; }
    .text-primaria { color: var(--cor-primaria) !important; }
    .border-primaria { border-color: var(--cor-primaria) !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-32">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col justify-between">
    
    <div>
      <!-- Topo Fixo com Logo e Status -->
      <header class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-slate-100 z-30 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <img id="loja-logo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-xl object-cover border border-slate-100 shadow-xs" alt="Logo" />
          <div>
            <h1 id="loja-nome" class="font-extrabold text-sm text-slate-900 truncate">Carregando...</h1>
            <span class="text-[10px] text-indigo-600 font-bold flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span> Agenda Aberta
            </span>
          </div>
        </div>
        <button id="btn-topo-agendados" class="relative p-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold flex items-center gap-1">
          🗓️ <span id="badge-servicos" class="bg-primaria text-white text-[10px] px-1.5 py-0.5 rounded-full font-black">0</span>
        </button>
      </header>

      <!-- Carrossel de Banners Clicáveis (Serviços & Ofertas) -->
      <div class="p-4 pb-2">
        <div class="relative h-44 rounded-2xl overflow-hidden shadow-md bg-slate-900 group cursor-pointer" id="banner-container">
          <div id="banner-slides" class="flex transition-transform duration-500 ease-out h-full">
            <!-- Injetado dinamicamente via JS -->
          </div>
          <div class="absolute bottom-2.5 inset-x-0 flex justify-center gap-1.5 z-10" id="banner-dots"></div>
        </div>
      </div>

      <!-- Barra de Pesquisa de Procedimentos -->
      <div class="px-4 py-2">
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center text-slate-400 text-xs">🔍</span>
          <input type="text" id="input-busca" placeholder="Buscar serviço ou procedimento..." class="w-full bg-slate-100 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-300" />
        </div>
      </div>

      <!-- Menu Rolável de Categorias (Chips) -->
      <div class="sticky top-[61px] bg-white z-20 px-4 py-2 border-b border-slate-100 shadow-xs">
        <div id="categorias-scroll" class="flex gap-2 overflow-x-auto no-scrollbar">
          <button class="cat-pill active px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-primaria text-white shadow-xs" data-cat="todos">
            Todos os Serviços
          </button>
          <button class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-100 text-slate-600" data-cat="Cabelo">
            ✂️ Cabelo
          </button>
          <button class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-100 text-slate-600" data-cat="Barba">
            🪒 Barba
          </button>
          <button class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-100 text-slate-600" data-cat="Estética">
            💆 Estética & Facial
          </button>
          <button class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-100 text-slate-600" data-cat="Combos">
            ⭐ Combos Especiais
          </button>
        </div>
      </div>

      <!-- Lista de Procedimentos / Serviços -->
      <main class="p-4 space-y-3" id="lista-servicos">
        <div class="py-12 text-center text-slate-400 text-xs animate-pulse">Carregando serviços...</div>
      </main>
    </div>

  </div>

  <!-- Barra Flutuante Inferior (Aparece ao selecionar serviços) -->
  <div id="barra-booking-fixa" class="fixed bottom-4 inset-x-4 max-w-md mx-auto z-40 hidden">
    <div class="bg-slate-900 text-white rounded-2xl p-3.5 shadow-2xl flex items-center justify-between border border-slate-800 backdrop-blur-md">
      <div class="flex items-center gap-3 pl-1">
        <div class="w-9 h-9 rounded-xl bg-primaria flex items-center justify-center font-black text-xs text-white">
          <span id="barra-qtd-servicos">0</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 uppercase font-semibold block">Total Estimado</span>
          <span id="barra-total-booking" class="font-extrabold text-sm text-white">R$ 0,00</span>
        </div>
      </div>
      <button id="btn-avancar-data" class="bg-primaria text-white font-bold text-xs px-4 py-2.5 rounded-xl hover:opacity-90 active:scale-95 transition shadow">
        Escolher Horário ➔
      </button>
    </div>
  </div>

  <!-- Bottom Sheet Drawer de Agendamento (Data, Slots e Dados) -->
  <div id="modal-agendamento" class="fixed inset-0 bg-slate-950/60 z-50 flex flex-col justify-end backdrop-blur-xs hidden">
    <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl max-h-[92vh] flex flex-col shadow-2xl">
      
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="font-extrabold text-base text-slate-900">Confirmar Horário</h2>
          <p class="text-[11px] text-slate-500 font-medium" id="resumo-servicos-selecionados">1 serviço selecionado</p>
        </div>
        <button id="btn-fechar-modal" class="text-xs font-bold text-slate-400 hover:text-slate-600 px-2 py-1">Fechar ✕</button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
        <!-- Serviços Selecionados no Topo com botão de remover -->
        <div id="booking-itens-resumo" class="space-y-2"></div>

        <!-- Escolha do Profissional -->
        <div>
          <label class="block text-xs font-extrabold text-slate-900 uppercase tracking-wider mb-2">1. Escolha o Profissional</label>
          <div class="grid grid-cols-3 gap-2" id="grade-profissionais">
            <button type="button" class="opt-pro p-2 rounded-xl border text-center border-primaria bg-primaria text-white" data-pro="Qualquer disponível">
              <span class="block text-xs font-black">Qualquer um</span>
              <span class="text-[10px] opacity-80">Mais rápido</span>
            </button>
            <button type="button" class="opt-pro p-2 rounded-xl border text-center border-slate-200 bg-slate-50 text-slate-700" data-pro="Especialista 1">
              <span class="block text-xs font-black">Lucas</span>
              <span class="text-[10px] opacity-80">Principal</span>
            </button>
            <button type="button" class="opt-pro p-2 rounded-xl border text-center border-slate-200 bg-slate-50 text-slate-700" data-pro="Especialista 2">
              <span class="block text-xs font-black">Carlos</span>
              <span class="text-[10px] opacity-80">Visagista</span>
            </button>
          </div>
        </div>

        <!-- Seletor de Dias em Carrossel Horizontal -->
        <div>
          <label class="block text-xs font-extrabold text-slate-900 uppercase tracking-wider mb-2">2. Escolha o Dia</label>
          <div id="carrossel-dias" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
        </div>

        <!-- Slots de Horários por Turnos -->
        <div>
          <label class="block text-xs font-extrabold text-slate-900 uppercase tracking-wider mb-1.5">3. Horário</label>
          <p class="text-[10px] font-bold text-slate-400 mb-1 uppercase">☀️ Manhã</p>
          <div id="slots-manha" class="grid grid-cols-4 gap-2 mb-2"></div>

          <p class="text-[10px] font-bold text-slate-400 mb-1 uppercase">🌤️ Tarde / Noite</p>
          <div id="slots-tarde" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- Cupom de Desconto de Primeira Visita -->
        <div class="flex gap-2 pt-2 border-t border-slate-100">
          <input type="text" id="input-cupom" placeholder="CUPOM (ex: CLIENTEVIP)" class="flex-1 uppercase bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold outline-none" />
          <button id="btn-aplicar-cupom" class="bg-slate-900 text-white font-bold text-xs px-3.5 py-2 rounded-xl">Aplicar</button>
        </div>
        <p id="msg-cupom" class="text-[10px] font-bold text-emerald-600 hidden">Desconto aplicado com sucesso (-15%)!</p>

        <!-- Dados do Cliente -->
        <div class="space-y-2">
          <input type="text" id="cli-nome" placeholder="Seu Nome Completo" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none" />
          <input type="tel" id="cli-whats" placeholder="Seu WhatsApp (com DDD)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none" />
        </div>
      </div>

      <!-- Barra de Ação Final -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between gap-3">
        <div>
          <span class="text-[10px] text-slate-400 uppercase font-bold block">Valor Total</span>
          <span id="preco-total-final" class="font-black text-sm text-slate-900">R$ 0,00</span>
        </div>
        <button id="btn-confirmar-agendamento" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs px-5 py-3 rounded-xl shadow-lg shadow-emerald-600/30 active:scale-95 transition">
          Confirmar no WhatsApp 🗓️
        </button>
      </div>

    </div>
  </div>

  <script type="module" src="/src/agendamento.js"></script>
</body>
</html>
